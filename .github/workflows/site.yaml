name: Build documentation site

on:
  push:
    branches: [main, dev]

env:
  DOCS_REPO: fletcher-package/fletcher-package.github.io

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.5

      - name: Build manual PDF
        run: pixi run manual compile

      - name: Build site
        run: pixi run site compile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/site/

      - name: Trigger site deployment
        env:
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          gh workflow run deploy.yaml \
            --repo ${{ env.DOCS_REPO }} \
            -f run_id="${{ github.run_id }}"