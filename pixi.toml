[workspace]
name = "fletcher"
authors = ["jollywatt <jo.alex.w@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
codebook-lsp = ">=0.4.0,<0.5"
nushell = ">=0.112.2,<0.113"
typst = "==0.15.0"
tytanic = "==0.4.1"

[tasks]
test = "scripts/test-and-sign.nu"
install = "scripts/install.nu"
check = "codebook-lsp lint **/*.typ"

[tasks.readme]
args = [{ arg = "mode", choices = ["watch", "compile"] }]
cmd = "typst {{ mode }} README.typ . --format bundle --features bundle "

[tasks.manual]
args = [{ arg = "mode", choices = ["watch", "compile"] }]
cmd = "typst {{ mode }} --root . docs/manual.typ --features html"

[tasks.site]
args = [{ arg = "mode", choices = ["watch", "compile"] }]
cmd = "typst {{ mode }} --root . docs/site.typ --features html,bundle --format bundle"
